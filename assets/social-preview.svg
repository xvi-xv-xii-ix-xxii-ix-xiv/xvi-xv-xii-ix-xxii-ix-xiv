<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Yngvarr — systems engineer and head of network infrastructure. Two communities joined by a single bridge edge carrying 30 of the 55 shortest paths.">
  <style>
