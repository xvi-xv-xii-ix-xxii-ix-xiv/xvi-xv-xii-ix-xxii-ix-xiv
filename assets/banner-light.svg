<svg xmlns="http://www.w3.org/2000/svg" width="880" height="276" viewBox="0 0 880 276" role="img" aria-label="Yngvarr — systems engineer and head of network infrastructure. A graph of two communities, systems code and live infrastructure, joined by a single bridge edge that carries 30 of the 55 shortest paths.">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .lbl{font-size:9.5px;fill:#57606A;paint-order:stroke;stroke:#FFFFFF;
         stroke-width:3px;stroke-linejoin:round}
    .cap{font-size:9px;letter-spacing:2.2px;fill:#6E7781}
    .sub{font-size:7.5px;letter-spacing:.4px;fill:#C4441F;opacity:.85}
    .hd{font-size:7px;letter-spacing:1.4px;fill:#6E7781;opacity:.7}
    .mono{font-size:8.5px;fill:#57606A}
    .note{font-size:7.5px;letter-spacing:1.2px;fill:#6E7781;opacity:.6}
    .eA{stroke:#0969DA;stroke-width:1.3;fill:none;opacity:.55}
    .eB{stroke:#8250DF;stroke-width:1.3;fill:none;opacity:.55}
    .br{stroke:#C4441F;stroke-width:2.6;stroke-dasharray:7 5;stroke-linecap:round;
        animation:march 1.5s linear infinite}
    .link{animation:cut 11s ease-in-out infinite}
    .side{animation:dim 11s ease-in-out infinite}
    .pkt{fill:#C4441F;opacity:0;animation:travel 11s linear infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
    @keyframes cut{0%,76%{opacity:1} 80%,88%{opacity:.06} 92%,100%{opacity:1}}
    @keyframes dim{0%,76%{opacity:1} 80%,88%{opacity:.22} 92%,100%{opacity:1}}
    @keyframes travel{
      0%{cx:262px;opacity:0} 2%{opacity:1}
      22%{cx:448px} 24%{cx:448px}
      44%{cx:262px} 46%{cx:262px}
      66%{cx:448px;opacity:1} 70%{cx:448px;opacity:0}
      71%{cx:262px;opacity:0} 100%{cx:262px;opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .br,.link,.side,.pkt{animation:none} .pkt{opacity:0}}
  </style>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E9EDF1" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect x="0" y="0" width="880" height="276" fill="url(#fade)"/></mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="276">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x=".5" y=".5" width="879" height="275" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="1" y="86" width="878" height="189" fill="url(#g)" mask="url(#gm)"/>

  <g class="m">
    <text x="40" y="42" font-size="27" letter-spacing="8" fill="#1F2328">YNGVARR</text>
    <g transform="translate(226,25) scale(0.009827)" fill="#6E7781" opacity=".6"><path d="M205.0 1649.0 0.0 1730.0V1669.0L41.0 1653.0V127.0L0.0 143.0V82.0L205.0 0.0V61.0L164.0 78.0V1604.0L205.0 1587.0ZM1858.0 1120.0 1636.0 1266.0 1247.0 971.0V1604.0L1288.0 1587.0V1649.0L1083.0 1730.0V1669.0L1124.0 1653.0V879.0L659.0 526.0L537.0 610.0L514.0 571.0L735.0 426.0L1124.0 719.0V127.0L1083.0 143.0V82.0L1288.0 0.0V61.0L1247.0 78.0V811.0L1712.0 1163.0L1835.0 1081.0ZM3173.0 88.0 3064.0 180.0 2948.0 124.0 2278.0 848.0V1604.0L2319.0 1587.0V1649.0L2114.0 1730.0V1669.0L2155.0 1653.0V127.0L2114.0 143.0V82.0L2319.0 0.0V61.0L2278.0 78.0V786.0L2999.0 8.0ZM4382.0 580.0 4308.0 629.0V1604.0L4349.0 1587.0V1649.0L4144.0 1730.0V1669.0L4185.0 1653.0V596.0L3591.0 223.0V1604.0L3632.0 1587.0V1649.0L3427.0 1730.0V1669.0L3468.0 1653.0V147.0L3444.0 131.0L3552.0 39.0ZM5971.0 571.0 5862.0 663.0 5719.0 594.0 5360.0 829.0V1604.0L5401.0 1587.0V1649.0L5196.0 1730.0V1669.0L5237.0 1653.0V911.0L4799.0 1200.0L4625.0 1120.0L4734.0 1028.0L4877.0 1098.0L5237.0 860.0V127.0L5196.0 143.0V82.0L5401.0 0.0V61.0L5360.0 78.0V778.0L5797.0 491.0ZM7007.0 489.0 6370.0 199.0V911.0ZM7212.0 1513.0 6991.0 1659.0 6370.0 1100.0V1604.0L6411.0 1587.0V1649.0L6206.0 1730.0V1669.0L6247.0 1653.0V141.0L6223.0 131.0L6331.0 39.0L7161.0 438.0L6403.0 942.0L7067.0 1556.0L7189.0 1474.0Z"/></g>
    <rect x="42" y="51" width="42" height="2.5" fill="#C4441F"/>
    <text x="840" y="42" font-size="12.5" text-anchor="end" fill="#57606A">systems engineer · head of network infrastructure</text>
    <rect x="40" y="60" width="191" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="135" y="72" font-size="9" text-anchor="middle" fill="#1F2328">20+ years in production networks</text>
    <rect x="239" y="60" width="72" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="275" y="72" font-size="9" text-anchor="middle" fill="#57606A">7 packages</text>
    <rect x="319" y="60" width="110" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="374" y="72" font-size="9" text-anchor="middle" fill="#1F2328">52 000+ downloads</text>
    <rect x="437" y="60" width="83" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="478" y="72" font-size="9" text-anchor="middle" fill="#1F2328">24 engineers</text>
    <rect x="527" y="60" width="67" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="561" y="72" font-size="9" text-anchor="middle" fill="#1F2328">30+ sites</text>
    <rect x="602" y="60" width="94" height="17" rx="8.5" fill="#F4F6F8" stroke="#D0D7DE"/><text x="649" y="72" font-size="9" text-anchor="middle" fill="#57606A">Remote CET/EET</text>
    <line x1="1" y1="86" x2="879" y2="86" stroke="#D0D7DE"/>

    <g transform="translate(0,0) scale(1.0)">
    <ellipse cx="206" cy="183" rx="80" ry="83" fill="#0969DA" opacity="0.10" filter="url(#soft)"/>
    <ellipse cx="530" cy="181" rx="106" ry="79" fill="#8250DF" opacity="0.10" filter="url(#soft)"/>
    <text class="cap" x="200" y="99" text-anchor="middle" fill="#0969DA">SYSTEMS CODE</text>
    <path class="eA" d="M206 126 L150 160 M150 160 L166 224 M166 224 L228 240 M228 240 L262 180 M262 180 L206 126 M206 126 L228 240 M150 160 L262 180 M206 126 L166 224"/>
    <circle cx="206" cy="126" r="6.0" fill="#0969DA" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="150" cy="160" r="5.8" fill="#0969DA" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="166" cy="224" r="4.8" fill="#0969DA" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="228" cy="240" r="5.8" fill="#0969DA" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="262" cy="180" r="13.5" fill="#C4441F" opacity=".14"/><circle cx="262" cy="180" r="9.5" fill="#FFFFFF" stroke="#C4441F" stroke-width="2.3"/>
    <text class="lbl" x="206" y="116" text-anchor="middle">Rust · C · C++</text>
    <text class="lbl" x="138" y="163" text-anchor="end">no_std · Cortex-M</text>
    <text class="lbl" x="154" y="227" text-anchor="end">STM32 · RTIC · DMA</text>
    <text class="lbl" x="228" y="261" text-anchor="middle">PQC · binary tooling</text>
    <text class="lbl" x="262" y="202" text-anchor="middle" fill="#1F2328">algorithms</text>
    <g class="side">
      <text class="cap" x="530" y="99" text-anchor="middle" fill="#8250DF">LIVE INFRASTRUCTURE</text>
      <path class="eB" d="M448 180 L498 128 M498 128 L556 140 M556 140 L612 178 M612 178 L578 234 M578 234 L502 230 M502 230 L448 180 M498 128 L502 230 M556 140 L578 234"/>
      <circle cx="498" cy="128" r="7.5" fill="#8250DF" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="556" cy="140" r="6.5" fill="#8250DF" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="612" cy="178" r="4.2" fill="#8250DF" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="578" cy="234" r="6.5" fill="#8250DF" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="502" cy="230" r="7.5" fill="#8250DF" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="448" cy="180" r="13.6" fill="#C4441F" opacity=".14"/><circle cx="448" cy="180" r="9.6" fill="#FFFFFF" stroke="#C4441F" stroke-width="2.3"/>
      <text class="lbl" x="498" y="116" text-anchor="middle">SIP · RTP · E1/PRI</text>
    <text class="lbl" x="606" y="212" text-anchor="middle">campus · DC · SCS</text>
    <text class="lbl" x="502" y="258" text-anchor="middle">IP-PBX · SBC</text>
    <text class="lbl" x="448" y="202" text-anchor="middle" fill="#1F2328">topology</text>
    </g>
    <g class="link">
      <line x1="262" y1="180" x2="448" y2="180" stroke="#FFFFFF" stroke-width="6"/>
      <g filter="url(#glow)"><line class="br" x1="262" y1="180" x2="448" y2="180"/></g>
    </g>
    <circle class="pkt" cx="262" cy="180" r="3.4"/>
    <text x="355" y="160" font-size="8.5" text-anchor="middle" fill="#6E7781">edge betweenness 30/55</text>
  </g>

    <line x1="662" y1="100" x2="662" y2="266" stroke="#D0D7DE"/>
    <text class="cap" x="676" y="114">$ show int brief</text>
    <text class="sub" x="676" y="127">the two tracks, as ports</text>
    <text class="hd" x="676" y="148">IFACE</text><text class="hd" x="724" y="148">STATE</text><text class="hd" x="840" y="148" text-anchor="end">CARRIES</text>
    <text class="mono" x="676" y="166" fill="#0969DA">sys/0</text><text class="mono" x="724" y="166" fill="#1A7F37">up/up</text><text class="mono" x="840" y="166" text-anchor="end" fill="#57606A">Rust · C · C++</text>
    <text class="mono" x="676" y="185" fill="#0969DA">emb/0</text><text class="mono" x="724" y="185" fill="#1A7F37">up/up</text><text class="mono" x="840" y="185" text-anchor="end" fill="#57606A">no_std · STM32</text>
    <text class="mono" x="676" y="204" fill="#8250DF">net/0</text><text class="mono" x="724" y="204" fill="#1A7F37">up/up</text><text class="mono" x="840" y="204" text-anchor="end" fill="#57606A">campus · DC</text>
    <text class="mono" x="676" y="223" fill="#8250DF">voice/0</text><text class="mono" x="724" y="223" fill="#1A7F37">up/up</text><text class="mono" x="840" y="223" text-anchor="end" fill="#57606A">SIP · E1/PRI</text>
    <text class="mono" x="676" y="242" fill="#C4441F">br/0</text><text class="mono" x="724" y="242" fill="#1A7F37">up/up</text><text class="mono" x="840" y="242" text-anchor="end" fill="#57606A">30 of 55 paths</text>
    <text class="note" x="840" y="267" text-anchor="end">no backup route configured</text>
  </g>
</svg>
