<svg xmlns="http://www.w3.org/2000/svg" width="880" height="276" viewBox="0 0 880 276" role="img" aria-label="Yngvarr — systems engineer and head of network infrastructure. A graph whose two communities are systems code and live infrastructure, joined by a single bridge edge: the edge most engineers do not have.">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .lbl{font-size:9.5px;fill:#57606A}
    .cap{font-size:9px;letter-spacing:2.2px;fill:#8C959F}
    .ed{stroke:#B6BFC8;stroke-width:1.5;fill:none}
    .path{stroke:#1F2328;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;opacity:.8}
    .nA{fill:#1F2328}
    .nB{fill:#FFFFFF;stroke:#B6BFC8;stroke-width:1.8}
    .br{stroke:#C4441F;stroke-width:2.6;stroke-dasharray:7 5;stroke-linecap:round;animation:march 1.5s linear infinite}
    @media (prefers-reduced-motion:reduce){.br{animation:none}}
    @keyframes march{to{stroke-dashoffset:-24}}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E8ECF0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="275" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="1" y="85" width="878" height="190" fill="url(#grid)"/>

  <g class="m">
    <text x="40" y="44" font-size="27" letter-spacing="8" fill="#1F2328">YNGVARR</text>
    <rect x="42" y="53" width="42" height="2.5" fill="#C4441F"/>
    <text x="232" y="44" font-size="12.5" fill="#57606A">systems engineer · head of network infrastructure</text>
    <text x="40" y="72" font-size="10.5" fill="#8C959F"><tspan fill="#1F2328">IT since 1997</tspan><tspan fill="#B6BFC8"> · </tspan>8 packages<tspan fill="#B6BFC8"> · </tspan><tspan fill="#57606A">52 000+ downloads</tspan><tspan fill="#B6BFC8"> · </tspan><tspan fill="#57606A">24 engineers</tspan><tspan fill="#B6BFC8"> · </tspan><tspan fill="#57606A">30+ sites</tspan><tspan fill="#B6BFC8"> · </tspan>Remote CET/EET</text>
    <line x1="1" y1="85" x2="879" y2="85" stroke="#D0D7DE"/>

    <text class="cap" x="215" y="104" text-anchor="middle">SYSTEMS CODE</text>
    <text class="cap" x="520" y="104" text-anchor="middle">LIVE INFRASTRUCTURE</text>

    <path class="ed" d="M273 183 L233 128 M233 128 L168 149 M168 149 L168 217 M168 217 L233 238 M233 238 L273 183 M233 128 L233 238"/>
    <path class="ed" d="M462 183 L502 128 M502 128 L567 149 M567 149 L567 217 M567 217 L502 238 M502 238 L462 183 M502 128 L567 217"/>
    <polyline class="path" points="168,149 233,128 273,183 462,183 502,128 567,149"/>
    <line x1="273" y1="183" x2="462" y2="183" stroke="#FFFFFF" stroke-width="6"/>
    <line class="br" x1="273" y1="183" x2="462" y2="183"/>

    <circle class="nA" cx="233" cy="128" r="6"/>
    <circle class="nA" cx="168" cy="149" r="6"/>
    <circle class="nA" cx="168" cy="217" r="6"/>
    <circle class="nA" cx="233" cy="238" r="6"/>
    <circle class="nB" cx="502" cy="128" r="6"/>
    <circle class="nB" cx="567" cy="149" r="6"/>
    <circle class="nB" cx="567" cy="217" r="6"/>
    <circle class="nB" cx="502" cy="238" r="6"/>
    <circle cx="273" cy="183" r="9" fill="#1F2328" stroke="#C4441F" stroke-width="2.2"/>
    <circle cx="462" cy="183" r="9" fill="#FFFFFF" stroke="#C4441F" stroke-width="2.2"/>

    <text class="lbl" x="233" y="116" text-anchor="middle">Rust · C · C++</text>
    <text class="lbl" x="156" y="152" text-anchor="end">no_std · Cortex-M</text>
    <text class="lbl" x="156" y="220" text-anchor="end">STM32 · RTIC · DMA</text>
    <text class="lbl" x="233" y="256" text-anchor="middle">PQC · binary tooling</text>
    <text class="lbl" x="273" y="204" text-anchor="middle" fill="#1F2328">algorithms</text>

    <text class="lbl" x="502" y="116" text-anchor="middle">SIP · RTP · E1/PRI</text>
    <text class="lbl" x="579" y="152">campus · DC · SCS</text>
    <text class="lbl" x="579" y="220">IP-PBX · SBC</text>
    <text class="lbl" x="502" y="256" text-anchor="middle">24 engineers · 30+ sites</text>
    <text class="lbl" x="462" y="204" text-anchor="middle" fill="#1F2328">topology</text>

    <text x="368" y="167" font-size="10" text-anchor="middle" fill="#C4441F">the edge most engineers don't have</text>

    <line x1="700" y1="96" x2="700" y2="248" stroke="#D0D7DE"/>
    <text class="cap" x="720" y="104">XGRAPH 3.0</text>
    <g class="lbl" fill="#8C959F">
      <line x1="720" y1="134" x2="744" y2="134" stroke="#C4441F" stroke-width="2.4" stroke-dasharray="6 4"/>
      <text x="754" y="137">bridges</text>
      <line x1="720" y1="164" x2="744" y2="164" stroke="#1F2328" stroke-width="2.3" opacity=".8"/>
      <text x="754" y="167">dijkstra</text>
      <circle cx="726" cy="194" r="6" fill="#8C959F"/><circle cx="742" cy="194" r="3" fill="#8C959F"/>
      <text x="754" y="197">centrality</text>
      <circle cx="726" cy="224" r="4.5" fill="#1F2328"/>
      <circle cx="742" cy="224" r="4.5" fill="#FFFFFF" stroke="#B6BFC8" stroke-width="1.8"/>
      <text x="754" y="227">communities</text>
    </g>
  </g>
</svg>
